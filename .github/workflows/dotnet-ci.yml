name: BankSphere CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-build-test:
    name: Build & Test Backend (.NET)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore backend/BankSphere.sln

    - name: Build
      run: dotnet build backend/BankSphere.sln --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test backend/BankSphere.sln --no-build --configuration Release --verbosity normal

  frontend-build:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      working-directory: frontend/banksphere-ui
      run: npm ci || npm install

    - name: Build React App
      working-directory: frontend/banksphere-ui
      run: npm run build
