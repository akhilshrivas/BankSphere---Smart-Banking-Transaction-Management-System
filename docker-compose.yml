services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: banksphere-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=BankSphere@Pass2026!
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'BankSphere@Pass2026!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banksphere-api
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=BankSphereDB;User Id=sa;Password=BankSphere@Pass2026!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - JwtSettings__Secret=BankSphereSuperSecretKeyForJwtTokenAuth2026!MustBeVeryLong
      - JwtSettings__Issuer=BankSphereAPI
      - JwtSettings__Audience=BankSphereClient
      - JwtSettings__ExpiryMinutes=60

  frontend:
    build:
      context: ./frontend/banksphere-ui
      dockerfile: Dockerfile
    container_name: banksphere-ui
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  sqlserver-data:
